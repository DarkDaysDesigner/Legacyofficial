<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGACY MOTORS — Saf Mühendislik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #070708;
      color: #f5f5f7;
    }
    .blur-card {
      background: rgba(22, 22, 26, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-neutral-800">

  <!-- Apple Style Minimal Header -->
  <header class="w-full fixed top-0 z-50 blur-card border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl font-bold tracking-[0.25em] text-white">LEGACY</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-white/10 text-neutral-400 font-mono tracking-normal">TR</span>
      </div>
      <nav class="hidden md:flex items-center gap-8 text-xs font-medium tracking-wider text-neutral-400">
        <a href="#" class="hover:text-white transition">MODELLER</a>
        <a href="#" class="hover:text-white transition">MİMARİ</a>
        <a href="#" class="hover:text-white transition">ŞARJ AĞI</a>
        <a href="#" class="hover:text-white transition">ATÖLYE</a>
      </nav>
      <button class="text-xs font-semibold px-4 py-2 rounded-full bg-white text-black hover:bg-neutral-200 transition">
        Test Sürüşü
      </button>
    </div>
  </header>

  <!-- Ana Sahne -->
  <main class="flex-1 flex flex-col items-center justify-center pt-24 pb-12 px-4 max-w-7xl mx-auto w-full">
    
    <!-- Model Başlığı & Dinamik Fiyat -->
    <div class="text-center my-4">
      <p id="modelTag" class="text-xs font-semibold tracking-[0.3em] uppercase text-neutral-500 mb-2">ELEKTRİKLİ RESTOMOD</p>
      <h1 id="modelTitle" class="text-4xl md:text-6xl font-bold tracking-tight text-white mb-2">Legacy GT 1964</h1>
      <p id="modelPrice" class="text-xl md:text-2xl font-light text-neutral-300 font-mono">4.200.000 ₺'den başlayan fiyatlarla</p>
    </div>

    <!-- Görsel Vitrini & Sağa/Sola Değiştirme -->
    <div class="relative w-full max-w-5xl aspect-[16/9] my-6 flex items-center justify-center group">
      <!-- Sol Buton -->
      <button onclick="prevVehicle()" class="absolute left-2 md:left-4 z-20 p-3 rounded-full blur-card text-white/70 hover:text-white hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Araç Görseli -->
      <div class="w-full h-full rounded-3xl overflow-hidden border border-white/10 shadow-2xl bg-neutral-950 flex items-center justify-center">
        <img id="vehicleImage" src="22022.png" alt="Legacy Model" class="w-full h-full object-cover transition-opacity duration-300">
      </div>

      <!-- Sağ Buton -->
      <button onclick="nextVehicle()" class="absolute right-2 md:right-4 z-20 p-3 rounded-full blur-card text-white/70 hover:text-white hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Renk Paleti & Detay Kartı -->
    <div class="w-full max-w-2xl blur-card p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-6">
      
      <!-- Yerel Renk Seçici -->
      <div class="flex flex-col items-center md:items-start">
        <span class="text-[11px] uppercase tracking-widest text-neutral-400 font-semibold mb-3">Gövde Rengi: <strong id="colorLabel" class="text-white">Ege Mavisi</strong></span>
        <div class="flex gap-3">
          <button onclick="changeColor('Ege Mavisi', '#16325C')" class="w-7 h-7 rounded-full ring-2 ring-offset-2 ring-offset-black ring-white transition" style="background-color: #16325C;"></button>
          <button onclick="changeColor('Anadolu Toprağı', '#B85D19')" class="w-7 h-7 rounded-full ring-1 ring-white/20 transition hover:scale-110" style="background-color: #B85D19;"></button>
          <button onclick="changeColor('Kapadokya Kızılı', '#731822')" class="w-7 h-7 rounded-full ring-1 ring-white/20 transition hover:scale-110" style="background-color: #731822;"></button>
          <button onclick="changeColor('Olympos Yeşili', '#244238')" class="w-7 h-7 rounded-full ring-1 ring-white/20 transition hover:scale-110" style="background-color: #244238;"></button>
          <button onclick="changeColor('Ayasofya Grisi', '#8A929A')" class="w-7 h-7 rounded-full ring-1 ring-white/20 transition hover:scale-110" style="background-color: #8A929A;"></button>
        </div>
      </div>

      <!-- Teknik Özet -->
      <div class="flex items-center gap-6 text-center border-t md:border-t-0 md:border-l border-white/10 pt-4 md:pt-0 md:pl-6">
        <div>
          <p id="specRange" class="text-xl font-bold font-mono">520 km</p>
          <p class="text-[10px] uppercase tracking-wider text-neutral-400">Menzil</p>
        </div>
        <div>
          <p id="specAccel" class="text-xl font-bold font-mono">3.8 sn</p>
          <p class="text-[10px] uppercase tracking-wider text-neutral-400">0-100 km/s</p>
        </div>
      </div>

      <!-- Sipariş Butonu -->
      <button class="w-full md:w-auto px-8 py-3.5 rounded-full bg-white text-black font-semibold text-xs tracking-wider uppercase hover:bg-neutral-200 transition shadow-lg">
        Rezerve Et
      </button>
    </div>

  </main>

  <script>
    const vehicles = [
      {
        tag: "ELEKTRİKLİ RESTOMOD",
        title: "Legacy GT 1964",
        price: "4.200.000 ₺",
        image: "22022.png",
        range: "520 km",
        accel: "3.8 sn"
      },
      {
        tag: "HİPER OTOMOBİL",
        title: "Legacy Apex",
        price: "8.900.000 ₺",
        image: "22023.png",
        range: "610 km",
        accel: "1.9 sn"
      },
      {
        tag: "OFF-ROAD & EXPEDITION",
        title: "Legacy Terra",
        price: "2.850.000 ₺",
        image: "22028.png",
        range: "580 km",
        accel: "4.5 sn"
      },
      {
        tag: "LÜKS AİLE SUV",
        title: "Legacy Spazio",
        price: "3.150.000 ₺",
        range: "640 km",
        image: "22026.jpg",
        accel: "4.2 sn"
      },
      {
        tag: "HAFİF ŞEHİR SERİSİ",
        title: "Legacy Neo-B",
        price: "1.650.000 ₺",
        image: "30552.png",
        range: "430 km",
        accel: "6.1 sn"
      }
    ];

    let currentIndex = 0;

    function renderVehicle(index) {
      const v = vehicles[index];
      const img = document.getElementById("vehicleImage");
      
      img.style.opacity = "0";
      setTimeout(() => {
        document.getElementById("modelTag").innerText = v.tag;
        document.getElementById("modelTitle").innerText = v.title;
        document.getElementById("modelPrice").innerText = `${v.price}'den başlayan fiyatlarla`;
        document.getElementById("specRange").innerText = v.range;
        document.getElementById("specAccel").innerText = v.accel;
        img.src = v.image;
        img.style.opacity = "1";
      }, 150);
    }

    function prevVehicle() {
      currentIndex = (currentIndex === 0) ? vehicles.length - 1 : currentIndex - 1;
      renderVehicle(currentIndex);
    }

    function nextVehicle() {
      currentIndex = (currentIndex === vehicles.length - 1) ? 0 : currentIndex + 1;
      renderVehicle(currentIndex);
    }

    function changeColor(name, hex) {
      document.getElementById("colorLabel").innerText = name;
    }
  </script>
</body>
</html>
